spring:
  application:
    name: pollapp-backend

  datasource:
    url: jdbc:postgresql://db:5432/pollapp
    username: pollapp
    password: pollapp
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/pollapp-realm

server:
  port: 8080

logging:
  level:
    org.springframework.security.oauth2: DEBUG
