spring:
  application:
    name: pollapp-backend

  datasource:
    url: jdbc:postgresql://postgres:5432/pollapp
    username: pollapp
    password: pollapp
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/pollapp-realm
          jwk-set-uri: http://keycloak:8080/realms/pollapp-realm/protocol/openid-connect/certs


server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG


