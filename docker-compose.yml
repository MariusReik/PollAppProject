version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create_databases.sql:/docker-entrypoint-initdb.d/create_databases.sql:ro
    networks:
      - pollnet


  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8082
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
    command: start-dev
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    networks:
      - pollnet


  rabbitmq:
    image: rabbitmq:3-management
    container_name: pollapp-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pollnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dat250-project-backend
    container_name: pollapp-backend
    depends_on:
      - keycloak
      - postgres
      - rabbitmq
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pollapp
      - SPRING_DATASOURCE_USERNAME=pollapp
      - SPRING_DATASOURCE_PASSWORD=pollapp
    ports:
      - "8081:8080"
    networks:
      pollnet:
        aliases:
          - localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dat250-project-frontend
    container_name: pollapp-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - pollnet
    environment:
      - VITE_DOCKER_ENV=true
volumes:
  postgres_data:

networks:
  pollnet:
    driver: bridge
